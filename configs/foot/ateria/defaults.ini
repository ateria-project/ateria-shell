# ATERIA MANAGED FILE
# Ateria can replace this file during a preset update. Do not edit this file.
# Put personal Foot settings in ../user.ini.

font=monospace:size=12
pad=12x12 center-when-maximized-and-fullscreen
resize-by-cells=yes

[scrollback]
lines=10000
multiplier=5.0

[cursor]
style=beam
blink=no

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.88
blur=yes
