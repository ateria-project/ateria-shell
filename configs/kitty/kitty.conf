# ATERIA MANAGED FILE
# Ateria can replace this file during a preset update. Do not edit this file.
# Put personal Kitty settings in user.conf.

# ATERIA COLORS
include ateria-colors.conf

# ATERIA PRESET
font_family monospace
font_size 12.0

window_padding_width 12
hide_window_decorations yes
background_opacity 0.88
dynamic_background_opacity yes
background_blur 1

cursor_shape beam
cursor_blink_interval 0

scrollback_lines 10000
wheel_scroll_multiplier 5.0

copy_on_select yes
strip_trailing_spaces smart
shell_integration enabled

tab_bar_style powerline
tab_powerline_style slanted
tab_bar_align left

confirm_os_window_close 0

# USER OVERRIDES
# This file is created once and is never changed by Ateria updates.
include user.conf
